# ==== 构建环境 ====
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# ==== 平台版本 ====
# 编译基线：1.20.1-47.4.23（1.20.1 上的最新 Forge），本机缓存已有其完整反编译产物。
# 改 forge_version 会触发下载该版本 userdev 并重新 patch 生成映射
# （MC 本身的反编译产物是共享的，所以换版本不必重做 MC 部分）。
# 注意：本机网络其实是通的（Java/Gradle 可正常访问 Forge Maven），
# 早前文档里"无外网"的说法已不成立。
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
# 运行时声明支持的 Forge 版本范围（Maven 版本范围语法），下界为约定保证兼容的最低版本。
# 依据：实测 47.0.0 -> 47.4.23 之间 Forge 的类只增不减（1148 -> 1169，仅删除 2 个内部实现类），
# 且本模组只引用 FML 核心 API，故用 47.4.23 编译出的产物可在 47.1.0+ 运行。
# 注意 loader_version_range 用的是 Forge 的主版本号，因此保持 [47,)。
forge_version_range=[47.1.0,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mixin 版本。必须与缓存中已有的 org.spongepowered:mixin:0.8.5 一致
# （该版本同时提供注解处理器，用于生成 ommc.refmap.json），改成别的版本会触发联网下载。
mixin_version=0.8.5

# ==== 模组信息 ====
# mod_id 保持 ommc 不变：它不只是显示字符串，还决定
#   ommc.mixins.json / ommc.refmap.json 的文件名（由 build.gradle 用 mod_id 拼出，
#   MixinConfigs 与 refmap 名一旦对不上，Mixin 会直接不加载）、
#   assets/ommc/lang 资源路径，以及 @Mod.EventBusSubscriber(modid = MOD_ID) 的匹配键。
# 界面上要显示成 "ommc-forge" 的诉求由下面的 mod_name / mod_authors 承担。
mod_id=ommc
mod_name=Oh My Minecraft Client Forge 1.20.1
mod_license=LGPL-3.0
mod_version=1.0.0
mod_group_id=com.plusls.ommc

# 作者一行要同时说清「谁做的 Forge 移植」和「原版是谁写的」。
# Forge 的模组列表界面直接显示 authors 原文，所以把两个身份都写进去。
mod_authors=TgYC0722 (Forge port), plusls (Fabric version author)
mod_description=Make Minecraft Client Great Again!
